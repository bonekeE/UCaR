services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - envs/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    container_name: bot
    restart: always
    build:
      context: ./bot
      dockerfile: Dockerfile
      args:
        APP_HOME: "/bot"
    depends_on:
      - postgres
    env_file:
      - ./envs/postgres.env
      - ./envs/bot.env

volumes:
  postgres_data:

